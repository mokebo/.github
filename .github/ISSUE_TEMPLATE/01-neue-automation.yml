name: Neue Automation
description: Etwas soll künftig automatisch passieren. Es ist entschieden, dass gebaut wird.
title: "Automation: "
type: Task
body:
  - type: markdown
    attributes:
      value: |
        Beschreibe den Anlass, nicht die Technik. Wörter wie Branch oder Pull Request sind neu? Siehe GITHUB-EINFACH-ERKLAERT.md im Repo mokebo/.github.
  - type: textarea
    id: wenn
    attributes:
      label: Wenn … (Auslöser)
      description: Was löst die Automation aus? Eine Uhrzeit, eine neue Bestellung, ein Ticket, eine Zeile im Sheet.
      placeholder: Wenn jeden Morgen um 7 Uhr die offenen Aufträge vom Vortag vorliegen …
    validations:
      required: true
  - type: textarea
    id: soll
    attributes:
      label: … soll … (was passiert)
      description: Was soll die Automation dann tun?
      placeholder: … soll sie alle Aufträge finden, deren Lieferzeit überschritten ist, …
    validations:
      required: true
  - type: textarea
    id: damit
    attributes:
      label: … damit … (Ergebnis)
      description: Was ist danach besser? Wie viel Zeit spart es heute, und wer merkt den Unterschied?
      placeholder: … damit Ops sie bis 9 Uhr in Slack sieht und die tägliche Handprüfung (20 Minuten) wegfällt.
    validations:
      required: true
  - type: dropdown
    id: zeit
    attributes:
      label: Wie viel Zeit ist es uns wert?
      description: Die Obergrenze für den Bau. Wird es mehr, wird neu entschieden statt einfach weitergebaut.
      options:
        - bis 2 Stunden
        - bis 1 Tag
        - bis 3 Tage
        - mehr, erst besprechen
    validations:
      required: true
  - type: dropdown
    id: laufzeit
    attributes:
      label: Wo soll es laufen?
      options:
        - noch offen
        - n8n
        - Google Apps Script
        - eigener Code
  - type: textarea
    id: fertig
    attributes:
      label: Fertig, wenn …
      description: Jeder Punkt lässt sich mit Ja oder Nein beantworten.
      value: |
        - [ ] läuft und ist getestet (wie: …)
        - [ ] README sagt: was es macht, wann es läuft, was tun, wenn es kaputt ist
    validations:
      required: true
  - type: textarea
    id: nicht
    attributes:
      label: Nicht Teil davon
      description: Was bauen wir bewusst nicht? Das verhindert, dass die Aufgabe immer größer wird.
  - type: markdown
    attributes:
      value: |
        **Ab hier die Spec.** Die Fragen kommen aus echten Pannen bei mokebo, zum Beispiel doppelte Tickets nach einem Abbruch mittendrin. Schreibt die Automation nirgendwohin, reicht bei den Fragen bis „Nachkontrolle“ ein „entfällt, liest nur“. Die Spec lebt nur in diesem Issue. Was bleiben soll, kommt vor dem Schließen in die README, in einen Test oder in eine Entscheidung (ADR 0007 in mokebo-ai).
  - type: dropdown
    id: schreibt
    attributes:
      label: Schreibt das irgendwohin?
      description: Schreiben heißt, es ändert etwas außerhalb des Workflows. Zum Beispiel Plenty, Shopify, Zendesk, ein Sheet, eine Datenbank oder eine Nachricht an Kunden.
      options:
        - Nein, es liest nur, rechnet oder meldet
        - Ja
    validations:
      required: true
  - type: textarea
    id: endzustand
    attributes:
      label: Endzustand je System
      description: Was steht nach einem erfolgreichen Lauf wo? Eine Zeile je System. Darunter, wer dort sonst noch zum selben Fall schreibt, etwa ein anderer Workflow, das System selbst oder ein Mensch von Hand.
      value: |
        | System und Stelle | vorher | nachher |
        |---|---|---|
        | … | … | … |

        Wer schreibt dort sonst noch zum selben Fall: …
    validations:
      required: true
  - type: textarea
    id: abbruch
    attributes:
      label: Abbruch mittendrin
      description: Was ist schon geschrieben, wenn der Lauf nach einem schreibenden Schritt abbricht? Wer bekommt dann eine Meldung, und wo?
    validations:
      required: true
  - type: textarea
    id: zweiter_lauf
    attributes:
      label: Zweiter Lauf direkt danach
      description: Was darf ein zweiter Lauf mit denselben Daten tun? Erwartet ist, dass nichts doppelt passiert. Woran erkennt er, dass ein Fall schon erledigt ist?
    validations:
      required: true
  - type: textarea
    id: randfaelle
    attributes:
      label: Randfälle
      description: Je Randfall ein Satz, was passieren soll.
      value: |
        - System antwortet leer, mit Fehler oder mit Limit (429): …
        - Ein Fall mit mehreren Teilen, zum Beispiel zwei Artikel in einer Bestellung: …
        - …
    validations:
      required: true
  - type: textarea
    id: beispieldaten
    attributes:
      label: Beispieldaten
      description: Welche festen Daten nimmt der Probelauf, und wo liegen sie im Repo? Je Randfall mindestens ein Datensatz. Keine echten Kundendaten.
    validations:
      required: true
  - type: textarea
    id: nachkontrolle
    attributes:
      label: Nachkontrolle
      description: Wann wird nach dem Live-Gang lesend geprüft, ob es stimmt, und woran erkennt man das? Der Termin richtet sich nach dem fremden System, nicht nach einer festen Frist. Manche Systeme legen Tage später selbst noch etwas an, dann erst danach prüfen.
    validations:
      required: true
  - type: input
    id: zustaendig
    attributes:
      label: Fachperson und Vertretung
      description: Wer weiß, ob das Ergebnis stimmt, und wer vertritt diese Person? Bei schreibenden Änderungen gibt die Fachperson die Spec vor dem Bau frei, mit dem Kommentar „Spec frei“ in diesem Issue.
      placeholder: z. B. Leitung Ops, Vertretung …
    validations:
      required: true
  - type: input
    id: asana
    attributes:
      label: Asana-Link
