name: basis-pruefung
on:
  workflow_call:
permissions:
  contents: read
jobs:
  pruefen:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # actions/checkout v7.0.1 (node24), per Commit-SHA festgelegt.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Direkter Programmaufruf statt gitleaks-action: die Action braucht fuer
      # Orgs einen (kostenlosen) Lizenzschluessel, das Programm nicht.
      # Version und SHA-256 fest. Wert am 14.10.2026 aus der Release-Pruefsummendatei
      # uebernommen. Bei einem Update beide Werte gemeinsam aendern.
      - name: Gitleaks installieren
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks

      # Liegt eine .gitleaks.toml im Repo, nimmt gitleaks sie automatisch.
      # Sie muss [extend] useDefault = true enthalten, sonst fallen die Standardregeln weg.
      - name: Secret-Scan
        run: gitleaks git --redact --verbose .

      # Bei Pull Requests muss CHANGELOG.md geaendert sein.
      # Ausweg fuer Kleinkram: das Kaestchen "Kleinkram, kein Changelog-Eintrag noetig" in der
      # PR-Vorlage ankreuzen. Gezaehlt wird nur das angekreuzte Kaestchen, nicht die Worte allein.
      # HEAD ist beim Pull Request der Probe-Merge, HEAD^1 der aktuelle Stand des Ziel-Branchs.
      - name: Changelog-Eintrag
        if: github.event_name == 'pull_request'
        env:
          PR_TEXT: ${{ github.event.pull_request.body }}
        run: |
          if [[ "$PR_TEXT" =~ \[[xX]\][[:space:]]*Kleinkram ]]; then
            echo "Kaestchen 'Kleinkram' ist angekreuzt. Pruefung uebersprungen."
            exit 0
          fi
          test -f CHANGELOG.md || { echo "::error::CHANGELOG.md fehlt im Repo"; exit 1; }
          if [ -n "$(git diff --name-only HEAD^1 HEAD -- CHANGELOG.md)" ]; then
            echo "CHANGELOG.md wurde geaendert."
          else
            echo "::error::CHANGELOG.md wurde in diesem Pull Request nicht geaendert. Eintrag ergaenzen oder bei Kleinkram das Kaestchen 'Kleinkram' im PR ankreuzen."
            exit 1
          fi

      # Die ersten 10 Zeilen muessen Zweck, Verantwortlich und Status mit echtem Wert haben.
      # Leere Werte und Platzhalter in <spitzen Klammern> zaehlen nicht.
      - name: README-Kopf vorhanden
        run: |
          test -f README.md || { echo "::error::README.md fehlt"; exit 1; }
          kopf="$(head -n 10 README.md)"
          fehler=0
          for feld in Zweck Verantwortlich Status; do
            zeile="$(printf '%s\n' "$kopf" | grep -E "^\*\*${feld}:\*\*" | head -n 1 || true)"
            wert="$(printf '%s' "$zeile" | sed -E "s/^\*\*${feld}:\*\*[[:space:]]*//")"
            if [ -z "$zeile" ]; then
              echo "::error::README.md: Zeile '**${feld}:**' fehlt in den ersten 10 Zeilen"; fehler=1
            elif [ -z "${wert//[[:space:]]/}" ] || [[ "$wert" == *"<"* ]]; then
              echo "::error::README.md: '${feld}' hat keinen echten Wert"; fehler=1
            fi
          done
          exit "$fehler"
