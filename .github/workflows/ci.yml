name: ci
on:
  pull_request:
    # edited: damit die Prüfung neu läuft, wenn jemand den PR-Text ändert (z. B. "kein Changelog").
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  basis:
    permissions:
      contents: read
    uses: ./.github/workflows/basis-pruefung.yml
